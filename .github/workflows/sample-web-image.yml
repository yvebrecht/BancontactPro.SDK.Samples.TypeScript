name: Sample web image

# Builds the sample web UI image. Pull requests only check that it builds; a push to main also publishes it to GitHub
# Container Registry, which is what docker-compose.yml pulls. Deploy tools such as Portainer cannot run the build
# themselves: the Dockerfile needs BancontactPro.TypeScript checked out next to this repository.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "Dockerfile.dockerignore"
      - ".github/workflows/sample-web-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "Dockerfile.dockerignore"
      - ".github/workflows/sample-web-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yvebrecht/bancontactpro-sample-web-typescript

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # The same layout as on a developer machine, because the Dockerfile builds from the folder above both repositories.
      - uses: actions/checkout@v4
        with:
          path: BancontactPro.SDK.Samples.TypeScript

      - uses: actions/checkout@v4
        with:
          repository: yvebrecht/BancontactPro.TypeScript
          ref: main
          path: BancontactPro.TypeScript

      - name: Build
        run: |
          docker build \
            -f BancontactPro.SDK.Samples.TypeScript/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            .

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "$IMAGE"